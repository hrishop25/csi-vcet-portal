<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="medallionRed" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="70%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4c0519" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <filter id="medallionShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Golden Ridged Rim -->
  <circle cx="80" cy="80" r="76" fill="url(#goldRim)" filter="url(#medallionShadow)" />
  <circle cx="80" cy="80" r="72" fill="#78350f" stroke="#fef08a" stroke-width="1.5" />
  
  <!-- Outer Beaded Circle -->
  <circle cx="80" cy="80" r="69" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Inner Crimson Core (Matching the Red Seal in Reference Image) -->
  <circle cx="80" cy="80" r="64" fill="url(#medallionRed)" stroke="#fef08a" stroke-width="2" />

  <!-- Classical Architectural Columns (Matching Reference Icon) -->
  <!-- Pediment / Roof Triangle -->
  <polygon points="80,27 48,43 112,43" fill="#ffffff" />
  <rect x="46" y="43" width="68" height="4" fill="#fef08a" rx="1" />

  <!-- 4 Classical Pillars -->
  <rect x="52" y="49" width="7" height="46" fill="#ffffff" rx="1.5" />
  <rect x="68" y="49" width="7" height="46" fill="#ffffff" rx="1.5" />
  <rect x="85" y="49" width="7" height="46" fill="#ffffff" rx="1.5" />
  <rect x="101" y="49" width="7" height="46" fill="#ffffff" rx="1.5" />

  <!-- Base Steps -->
  <rect x="46" y="96" width="68" height="4" fill="#fef08a" rx="1" />
  <rect x="43" y="101" width="74" height="4" fill="#ffffff" rx="1" />

  <!-- Foundation Year Seal -->
  <rect x="62" y="112" width="36" height="15" rx="3" fill="#4c0519" stroke="#fef08a" stroke-width="1"/>
  <text x="80" y="123" font-family="Georgia, serif" font-size="10" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="1">1994</text>
  
  <!-- Arch Subtext -->
  <text x="80" y="141" font-family="-apple-system, sans-serif" font-size="7" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="2">VCET • CSI</text>
</svg>
